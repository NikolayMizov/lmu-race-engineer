  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

px; letter-spacing:3px; color:#8a93a0; font-weight:700; font-style:italic;\">SPEECH RECOGNITION<\u002Fspan>\n          <p style=\"font-size:13px; color:#7b8390; margin:10px 0 14px;\">Listens on your default microphone and speaks responses using the engineer voice. Requires a Windows speech language pack (English).<\u002Fp>\n          <div style=\"display:flex; align-items:center; gap:14px; margin-bottom:14px;\"><span style=\"width:160px; font-size:14px; color:#cbd2db;\">Enable STT<\u002Fspan><span style=\"width:20px; height:20px; border-radius:3px; background:var(--accent,#3da5ff); display:flex; align-items:center; justify-content:center; color:#04121f; font-size:14px; font-weight:800;\">✓<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:20px;\"><span style=\"width:160px; font-size:14px; color:#cbd2db;\">Confidence Threshold<\u002Fspan><div style=\"flex:1; height:6px; background:#0e1014; border-radius:3px; position:relative;\"><div style=\"position:absolute; left:0; top:0; bottom:0; width:60%; background:var(--accent,#3da5ff); border-radius:3px;\"><\u002Fdiv><div style=\"position:absolute; left:60%; top:50%; transform:translate(-50%,-50%); width:14px; height:14px; border-radius:50%; background:#fff;\"><\u002Fdiv><\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace; font-size:13px; width:40px; text-align:right;\">60%<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- voice commands -->\n        <div style=\"background:linear-gradient(180deg,#15181e,#101216); border:1px solid #262b34; border-radius:6px; padding:18px 20px;\">\n          <span style=\"font-size:13px; letter-spacing:3px; color:#8a93a0; font-weight:700; font-style:italic;\">VOICE COMMANDS<\u002Fspan>\n          <p style=\"font-size:13px; color:#7b8390; margin:10px 0 14px;\">Edit the phrases that trigger each intent. Intent names are fixed — only the phrases can be changed.<\u002Fp>\n          <div style=\"display:grid; grid-template-columns:.7fr 2.3fr; color:#6b7280; font-size:11px; letter-spacing:1px; padding-bottom:9px; border-bottom:1px solid #23262d;\"><span>INTENT<\u002Fspan><span>PHRASES (comma-separated)<\u002Fspan><\u002Fdiv>\n          <sc-for list=\"{{ intents }}\" as=\"v\" hint-placeholder-count=\"6\">\n            <div style=\"display:grid; grid-template-columns:.7fr 2.3fr; align-items:center; padding:10px 0; border-bottom:1px solid #1c1f25; font-size:14px;\"><span style=\"font-weight:600;\">{{ v.intent }}<\u002Fspan><span style=\"color:#9aa2ad; font-family:'JetBrains Mono',monospace; font-size:12px;\">{{ v.phrases }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;#3da5ff&quot;,&quot;options&quot;:[&quot;#3da5ff&quot;,&quot;#00d6c2&quot;,&quot;#ffb400&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;redColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e10600&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;}}\">\nclass Component extends DCLogic {\n  state = { screen: 'telemetry' };\n  applyTheme() {\n    const r = document.documentElement;\n    r.style.setProperty('--accent', (this.props && this.props.accentColor) || '#3da5ff');\n    r.style.setProperty('--red', (this.props && this.props.redColor) || '#e10600');\n  }\n  componentDidMount() { this.applyTheme(); }\n  componentDidUpdate() { this.applyTheme(); }\n  nav(id) { return () => this.setState({ screen: id }); }\n  navStyle(id) {\n    const active = this.state.screen === id;\n    return {\n      display: 'flex', alignItems: 'center', gap: '14px', padding: '13px 22px',\n      cursor: 'pointer', fontSize: '17px', fontWeight: 600, letterSpacing: '.3px',\n      fontStyle: 'italic',\n      color: active ? '#fff' : '#8a93a0',\n      background: active ? 'var(--red,#e10600)' : 'transparent',\n      boxShadow: active ? '0 0 18px rgba(225,6,0,.35)' : 'none',\n      borderLeft: active ? '3px solid #fff' : '3px solid transparent'\n    };\n  }\n  renderVals() {\n    const s = this.state.screen;\n    const mkT = (p, h, t, c, st) => ({\n      p, h, t, s: st,\n      dot: { width: '9px', height: '9px', borderRadius: '50%', background: c, boxShadow: '0 0 8px ' + c, display: 'inline-block' },\n      temp: { fontFamily: \"'JetBrains Mono',monospace\", fontSize: '28px', fontWeight: 800, color: c, lineHeight: '.9' },\n      barOuter: { height: '7px', background: '#07080b', borderRadius: '4px', overflow: 'hidden', marginTop: '6px' },\n      barInner: { width: h, height: '100%', background: c }\n    });\n    const tyres = [\n      mkT('FL', '84%', '98°', '#33c25a', 'OPTIMAL'),\n      mkT('FR', '80%', '104°', '#ffc24b', 'WARM'),\n      mkT('RL', '71%', '112°', 'var(--red,#e10600)', 'OVERHEAT'),\n      mkT('RR', '86%', '94°', '#33c25a', 'OPTIMAL')\n    ];\n    const riskColor = { LOW: '#33c25a', MED: '#ffc24b', HIGH: 'var(--red,#e10600)' };\n    const mkC = (action, pit, score, fuel, risk, why) => ({\n      action, pit, score, fuel, risk, why,\n      scoreStyle: { fontFamily: \"'JetBrains Mono',monospace\", fontWeight: 800, color: score >= 90 ? '#33c25a' : (score >= 75 ? '#cbd2db' : '#9aa2ad') },\n      riskStyle: { fontFamily: \"'JetBrains Mono',monospace\", fontWeight: 700, color: riskColor[risk] }\n    });\n    const candidates = [\n      mkC('BOX NOW · UNDERCUT', 'L38', 94, '+0.6', 'LOW', 'Jumps CAR 07 before their stop on L40.'),\n      mkC('HOLD · OPTIMAL', 'L42', 88, '+1.1', 'LOW', 'Maximises stint, track position stays safe.'),\n      mkC('EXTEND · OVERCUT', 'L45', 71, '+0.2', 'MED', 'Clean air if CAR 07 pits early — tyre dependent.'),\n      mkC('PIT + DOUBLE STINT', 'L40', 64, '+1.8', 'HIGH', 'Fuel-safe but high tyre cliff risk late.')\n    ];\n    // --- lap dataset (single source for both table and chart) ---\n    const fmt = (sec) => { const m = Math.floor(sec / 60); const r = sec - m * 60; return m + ':' + r.toFixed(1).padStart(4, '0'); };\n    const lapData = [\n      { lap: 1, sec: 212.4, mode: 'NORMAL' }, { lap: 2, sec: 211.8, mode: 'NORMAL' },\n      { lap: 3, sec: 209.6, mode: 'PUSH' }, { lap: 4, sec: 211.2, mode: 'NORMAL' },\n      { lap: 5, sec: 213.6, mode: 'SAVE' }, { lap: 6, sec: 213.1, mode: 'SAVE' },\n      { lap: 7, sec: 211.0, mode: 'NORMAL' }, { lap: 8, sec: 208.9, mode: 'PUSH' },\n      { lap: 9, sec: 210.7, mode: 'NORMAL' }, { lap: 10, sec: 211.5, mode: 'NORMAL' },\n      { lap: 11, sec: 213.9, mode: 'SAVE' }, { lap: 12, sec: 211.3, mode: 'NORMAL' }\n    ];\n    const bestSec = Math.min(...lapData.map(d => d.sec));\n    const laps = lapData.map((d, i) => {\n      const wear = Math.max(20, 95 - i * 6);\n      return {\n        lap: d.lap, mode: d.mode, time: fmt(d.sec),\n        s1: '1:06.' + ((i + 2) % 6), s2: '1:35.' + ((i + 1) % 7), s3: '0:48.' + ((i + 3) % 8),\n        fuel: (3.0 + (i % 3) * 0.05).toFixed(2), wear: wear.toFixed(0) + '%'\n      };\n    });\n\n    // --- chart geometry ---\n    const compareB = !!this.state.compareB;\n    const PX0 = 70, PX1 = 1116, PY0 = 16, PY1 = 176;\n    const Y_MIN = 207.5, Y_MAX = 214.5;\n    const xOf = (i) => PX0 + (i / (lapData.length - 1)) * (PX1 - PX0);\n    const yOf = (sec) => PY0 + ((sec - Y_MIN) / (Y_MAX - Y_MIN)) * (PY1 - PY0);\n    const modeColor = { NORMAL: '#cbd2db', PUSH: 'var(--red,#e10600)', SAVE: '#33c25a' };\n    const lapPointsA = lapData.map((d, i) => xOf(i).toFixed(1) + ',' + yOf(d.sec).toFixed(1)).join(' ');\n    const lapDots = lapData.map((d, i) => {\n      const isBest = d.sec === bestSec;\n      return { cx: xOf(i).toFixed(1), cy: yOf(d.sec).toFixed(1), r: isBest ? 6 : 4, fill: isBest ? 'var(--accent,#3da5ff)' : modeColor[d.mode] };\n    });\n    const yTicks = [208, 210, 212, 214].map(sec => ({ y: yOf(sec).toFixed(1), label: fmt(sec) }));\n    const xTicks = lapData.map((d, i) => ({ x: xOf(i).toFixed(1), label: d.lap }));\n    // comparison session (only drawn when a B session is loaded)\n    const lapPointsB = lapData.map((d, i) => xOf(i).toFixed(1) + ',' + yOf(d.sec + 0.9 + (i % 3) * 0.15).toFixed(1)).join(' ');\n    const thresholds = [\n      { label: 'Tire Warn Health', val: '65', unit: '% health' },\n      { label: 'Tire Critical Health', val: '40', unit: '% health' },\n      { label: 'Tire Cold Temp', val: '65', unit: '°C' },\n      { label: 'Tire Optimal Low', val: '70', unit: '°C' },\n      { label: 'Tire Optimal High', val: '90', unit: '°C' },\n      { label: 'Tire Hot Temp', val: '95', unit: '°C' },\n      { label: 'Brake Warn Temp', val: '600', unit: '°C' },\n      { label: 'Brake Critical Temp', val: '850', unit: '°C' }\n    ];\n    const intents = [\n      { intent: 'Pit Window', phrases: 'pit window, when to pit, when should i pit, laps to pit, pit lap' },\n      { intent: 'Fuel Add', phrases: 'fuel to add, how much to add, add fuel, litres to add, fuel at pit' },\n      { intent: 'Pit Stops', phrases: 'pit stops, how many stops, stops remaining, more stops' },\n      { intent: 'Strategy Rec', phrases: \"strategy, what's the strategy, what should i do, recommendation\" },\n      { intent: 'Rival Update', phrases: 'rival update, undercut threat, overcut opportunity, threat check' },\n      { intent: 'Fuel Margin', phrases: 'fuel margin, fuel buffer, fuel safety, fuel to finish' },\n      { intent: 'Tire Cliff', phrases: 'tire cliff, tyre cliff, cliff risk, are my tires done' },\n      { intent: 'Projected Position', phrases: 'projected position, final position, where will i finish' }\n    ];\n    return {\n      isTelemetry: s === 'telemetry', isEngineer: s === 'engineer', isProfiles: s === 'profiles',\n      isMonitoring: s === 'monitoring', isLapTimes: s === 'laptimes', isSettings: s === 'settings',\n      goTel: this.nav('telemetry'), goEng: this.nav('engineer'), goPro: this.nav('profiles'),\n      goMon: this.nav('monitoring'), goLap: this.nav('laptimes'), goSet: this.nav('settings'),\n      navTel: this.navStyle('telemetry'), navEng: this.navStyle('engineer'), navPro: this.navStyle('profiles'),\n      navMon: this.navStyle('monitoring'), navLap: this.navStyle('laptimes'), navSet: this.navStyle('settings'),\n      tyres, candidates, laps, thresholds, intents,\n      lapPointsA, lapDots, yTicks, xTicks, lapPointsB, compareB,\n      compareLabel: compareB ? 'Circuit_de_la_Sarthe_296GT3_Race_2.csv' : '— none —',\n      toggleCompare: () => this.setState(st => ({ compareB: !st.compareB }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
